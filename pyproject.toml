[project]
name = "hal-9001"
version = "0.1.0"
description = "MCP servers giving an AI agent read-only access to public documents and a guarded SQL Server memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "mssql-python>=1.0",
    "python-docx>=1.1",
]

[project.scripts]
hal-documents = "hal_9001.server:main"
hal-memory = "hal_9001.memory_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hal_9001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
